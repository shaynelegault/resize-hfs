name: Disposable HFSX image lab
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-checkpoints:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qualify clean shrink and checkpoint restores
        run: python lab/qualify_macos.py --output "$RUNNER_TEMP/resize-hfs-lab"
      - uses: actions/upload-artifact@v4
        with:
          name: hfsx-image-summary
          path: ${{ runner.temp }}/resize-hfs-lab/summary.json
          if-no-files-found: error
          retention-days: 7
